
<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

<h1>Job Application Form</h1>
<p>Please fill in your details below.</p>

<form>

<fieldset>
<legend>Personal Information</legend>

<label for="name">Full Name:</label>
<input type="text" id="name" placeholder="Enter your name"
required minlength="3"><br><br>

<label for="email">Email:</label>
<input type="email" id="email" placeholder="Enter email"
required><br><br>

<label for="password">Password:</label>
<input type="password" id="password" required
minlength="6"><br><br>

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" pattern="[0-9]{10}"
placeholder="10 digit number" required><br><br>

<label for="website">Website:</label>
<input type="url" id="website"
placeholder="https://example.com"><br><br>

<label for="age">Age:</label>
<input type="number" id="age" min="18" max="60"><br><br>

</fieldset>

<fieldset>
<legend>Job Details</legend>

<label>Gender:</label>
<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label><br><br>

<label>Skills:</label>
<input type="checkbox" id="html" value="HTML">
<label for="html">HTML</label>

<input type="checkbox" id="css" value="CSS">
<label for="css">CSS</label>

<input type="checkbox" id="js" value="JavaScript">
<label for="js">JavaScript</label><br><br>

<label for="job">Select Job Role:</label>
<select id="job" required>
<option value="">Choose Job</option>
<option>Web Developer</option>
<option>Software Engineer</option>
<option>Designer</option>
</select><br><br>

<label for="city">City:</label>
<input list="cities" id="city" placeholder="Choose city">
<datalist id="cities">
<option value="Bareilly">
<option value="Delhi">
<option value="Lucknow">
<option value="Noida">
</datalist><br><br>

<label for="date">Date of Birth:</label>
<input type="date" id="date"><br><br>

<label for="time">Interview Time:</label>
<input type="time" id="time"><br><br>

<label for="file">Upload Resume:</label>
<input type="file" id="file"><br><br>

<label for="range">Experience (Years):</label>
<input type="range" id="range" min="0" max="20"><br><br>

<label for="color">Choose Theme Color:</label>
<input type="color" id="color"><br><br>

<label for="message">About Yourself:</label><br>
<textarea id="message" rows="5" cols="30"
placeholder="Write about yourself"></textarea><br><br>

</fieldset>

<input type="submit" value="Submit Application">
<input type="reset" value="Reset Form">

</form>

</body>
</html>

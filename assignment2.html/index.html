<!DOCTYPE html>
<html>
<head>
    <title>Choice Inputs</title>
</head>
<body>

<h2>Choice Input Form</h2>

<form>
    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    Skills:
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
    <br><br>

    Course:
    <select>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>MCA</option>
    </select>
    <br><br>

    City:
    <input list="cities">
    <datalist id="cities">
        <option value="Bareilly">
        <option value="Delhi">
        <option value="Lucknow">
    </datalist>
</form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

<h2>Validation Form</h2>

<form>
    Name:
    <input type="text"
    placeholder="Enter Name"
    required minlength="3">
    <br><br>

    Age:
    <input type="number"
    min="18" max="60">
    <br><br>

    Password:
    <input type="password"
    minlength="6" required>
    <br><br>

    Phone:
    <input type="tel"
    pattern="[0-9]{10}"
    placeholder="10 digit number"
    required>
    <br><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>

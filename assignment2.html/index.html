<!DOCTYPE html>
<html>
<head>
    <title>Labels</title>
</head>
<body>

<h2>Label Example</h2>

<form>
    <label for="name">Name:</label>
    <input type="text" id="name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email">
    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age">
</form>

</body>
</html>

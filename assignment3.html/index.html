<!DOCTYPE html>
<html>
<head>
<title>Table Structure</title>
</head>
<body>

<table border="1">
<caption>Student Marks Report</caption>

<thead>
<tr>
<th>Name</th>
<th>Maths</th>
<th>English</th>
</tr>
</thead>

<tbody>
<tr>
<td>Rahul</td>
<td>85</td>
<td>80</td>
</tr>
<tr>
<td>Aman</td>
<td>90</td>
<td>88</td>
</tr>
</tbody>

<tfoot>
<tr>
<td>Total</td>
<td>175</td>
<td>168</td>
</tr>
</tfoot>

</table>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>TH Scope Example</title>
</head>
<body>

<table border="1">

<tr>
<th scope="col">Name</th>
<th scope="col">Course</th>
<th scope="col">Marks</th>
</tr>

<tr>
<th scope="row">Rahul</th>
<td>B.Tech</td>
<td>85</td>
</tr>

<tr>
<th scope="row">Aman</th>
<td>BCA</td>
<td>90</td>
</tr>
</table>

</body>
</html>
